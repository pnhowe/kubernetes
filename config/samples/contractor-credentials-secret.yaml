# Template for the Secret the operator reads its contractor connection info from, see config/manager/manager.yaml
# Copy it, fill in the values, and apply it BEFORE deploying the operator, ie:
#   kubectl apply -f my-contractor-credentials.yaml
# It is not listed in kustomization.yaml on purpose, so `kubectl apply -k config/samples/` never applies the placeholders.
# Don't commit a filled in copy, use sealed-secrets or external-secrets if this is managed from git.
apiVersion: v1
kind: Secret
metadata:
  name: contractor-credentials  # must be this name, the kustomize namePrefix is not applied to it
  namespace: t3kton-contractor
type: Opaque
stringData:
  host: http://contractor.example.com
  username: k8s
  password: CHANGEME
