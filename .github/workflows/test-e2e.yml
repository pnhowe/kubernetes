name: E2E Tests

on:
  push:
  pull_request:

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The tests need a contractor with demo data, the demo stack from the docker repository.
      # The image is built from the sources (the first build is slow, the iPXE boot loaders are compiled)
      - name: Clone the contractor demo stack
        uses: actions/checkout@v4
        with:
          repository: T3kton/docker
          path: docker

      - name: Build the contractor demo image
        run: make -C docker image

      - name: Start the contractor demo stack
        run: |
          docker compose -f docker/docker-compose.yml up -d
          echo "Waiting for contractor, and the demo data..."
          for i in $(seq 1 60); do
            if [ "$(docker compose -f docker/docker-compose.yml ps -q demo-data | xargs -r docker inspect -f '{{.State.Status}} {{.State.ExitCode}}')" = "exited 0" ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker/docker-compose.yml logs
          exit 1

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e

      - name: Contractor logs, if it failed
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --tail 200
